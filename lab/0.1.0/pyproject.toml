[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schwarmwelt-lab"
version = "0.1.0"
description = "Lokales visuelles Labor für das künstlerische Schwarmwelt-MAS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schwarmwelt-lab = "schwarmwelt_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]
